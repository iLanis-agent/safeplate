<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafePlate - what can everyone actually eat?</title>
<style>
  :root { --bg:#131711; --panel:#1c231a; --line:#2e3a2b; --text:#eff4ec; --dim:#93a28e; --accent:#a8d97c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:26px 14px 44px; }
  h1 { font-size:30px; }
  .sub { color:var(--dim); margin:6px 0 18px; font-size:14px; text-align:center; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; width:min(620px, 94vw); margin-bottom:14px; }
  .card h2 { font-size:16px; margin-bottom:10px; }
  .guest { background:#12170f; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .guest .gname { font-weight:800; display:flex; justify-content:space-between; align-items:center; }
  .guest .gname .rm { color:var(--dim); cursor:pointer; font-size:13px; }
  .guest .gname .rm:hover { color:#e05252; }
  .rchips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .rchip { background:#232c20; border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:13px; cursor:pointer; color:var(--dim); }
  .rchip.on { background:var(--accent); color:#131711; border-color:var(--accent); font-weight:700; }
  .adder { display:flex; gap:8px; margin-top:4px; }
  input[type=text] { flex:1; background:#12170f; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:8px 12px; font-size:14px; }
  .adder button, .mini { background:#2a3524; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  .go { background:var(--accent); color:#131711; border:none; border-radius:9px; padding:11px 30px; font-size:16px; font-weight:800; cursor:pointer; margin:8px 0; }
  .course { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:1px; margin:12px 0 6px; }
  .dish { display:inline-block; background:#12170f; border:1px solid var(--line); border-radius:8px; padding:6px 12px; margin:0 6px 6px 0; font-size:14px; }
  .miss { color:var(--dim); font-size:13px; margin:4px 0; }
  .miss b { color:var(--text); }
  #summary { font-size:14px; margin-bottom:6px; }
  .actions { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .foot { margin-top:16px; color:var(--dim); font-size:13px; }
  a { color:var(--accent); text-decoration:none; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--accent); color:#131711; padding:8px 18px; border-radius:8px; font-weight:700; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
</style>
</head>
<body>
<h1>SafePlate</h1>
<div class="sub">add the guests, tap their restrictions - get the dishes everyone at the table can eat</div>

<div class="card">
  <h2>Who's eating?</h2>
  <div id="guests"></div>
  <div class="adder">
    <input type="text" id="guest-input" maxlength="20" placeholder="Add a guest">
    <button id="guest-add">Add</button>
  </div>
</div>

<button class="go" id="find">Find safe dishes</button>

<div class="card" id="result-card" style="display:none">
  <h2>The menu everyone can eat</h2>
  <div id="summary"></div>
  <div id="results"></div>
  <div class="course">Almost works (one swap away)</div>
  <div id="misses"></div>
  <div class="actions">
    <button class="mini" id="copy">Copy as text</button>
  </div>
</div>

<div class="foot"><a href="index.html">&larr; about</a></div>
<div id="toast"></div>

<script src="engine.js?v=1"></script>
<script>
(function () {
  var REST_KEYS = Object.keys(SafePlate.RESTRICTIONS);
  var guests = []; // {name, restrictions:[]}

  function save() { try { localStorage.setItem('safeplate', JSON.stringify(guests)); } catch (e) {} }
  function load() {
    try {
      var g = JSON.parse(localStorage.getItem('safeplate'));
      if (Array.isArray(g)) guests = g;
    } catch (e) {}
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function renderGuests() {
    var el = document.getElementById('guests');
    el.innerHTML = '';
    guests.forEach(function (g, gi) {
      var d = document.createElement('div');
      d.className = 'guest';
      var head = '<div class="gname"><span>' + esc(g.name) + '</span><span class="rm" data-gi="' + gi + '">remove</span></div>';
      var chips = '<div class="rchips">';
      REST_KEYS.forEach(function (rk) {
        chips += '<span class="rchip' + (g.restrictions.indexOf(rk) !== -1 ? ' on' : '') + '" data-gi="' + gi + '" data-rk="' + rk + '">' + SafePlate.RESTRICTIONS[rk].label + '</span>';
      });
      chips += '</div>';
      d.innerHTML = head + chips;
      el.appendChild(d);
    });
    el.querySelectorAll('.rchip').forEach(function (c) {
      c.addEventListener('click', function () {
        var gi = +c.getAttribute('data-gi'), rk = c.getAttribute('data-rk');
        var i = guests[gi].restrictions.indexOf(rk);
        if (i === -1) guests[gi].restrictions.push(rk);
        else guests[gi].restrictions.splice(i, 1);
        save();
        c.classList.toggle('on');
      });
    });
    el.querySelectorAll('.rm').forEach(function (x) {
      x.addEventListener('click', function () {
        guests.splice(+x.getAttribute('data-gi'), 1);
        save(); renderGuests();
      });
    });
  }

  function addGuest() {
    var inp = document.getElementById('guest-input');
    var v = inp.value.trim();
    if (!v || guests.some(function (g) { return g.name === v; }) || guests.length >= 10) return;
    guests.push({ name: v, restrictions: [] });
    inp.value = '';
    save(); renderGuests();
  }
  document.getElementById('guest-add').addEventListener('click', addGuest);
  document.getElementById('guest-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') addGuest(); });

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    setTimeout(function () { t.style.opacity = '0'; }, 1800);
  }

  var lastText = '';

  function find() {
    if (!guests.length) { toast('Add at least one guest'); return; }
    var union = [];
    guests.forEach(function (g) {
      g.restrictions.forEach(function (r) { if (union.indexOf(r) === -1) union.push(r); });
    });
    var safe = SafePlate.filterDishes(SafePlate.DISHES, union);
    var near = SafePlate.nearMisses(SafePlate.DISHES, union);

    document.getElementById('summary').textContent =
      safe.length + ' of ' + SafePlate.DISHES.length + ' dishes work for ' + guests.length + (guests.length === 1 ? ' guest' : ' guests') +
      (union.length ? ' (' + union.map(function (r) { return SafePlate.RESTRICTIONS[r].label; }).join(', ') + ')' : ' - no restrictions, everything goes');

    var courses = ['main', 'side', 'dessert'];
    var html = '';
    var textLines = [];
    courses.forEach(function (c) {
      var list = safe.filter(function (d) { return d.course === c; });
      if (!list.length) return;
      html += '<div class="course">' + c + 's</div>';
      list.forEach(function (d) { html += '<span class="dish">' + esc(d.name) + '</span>'; });
      textLines.push(c.toUpperCase() + 'S: ' + list.map(function (d) { return d.name; }).join(', '));
    });
    document.getElementById('results').innerHTML = html || '<div class="miss">Nothing in the bank survives this table - check the near misses below.</div>';

    var mh = '';
    near.slice(0, 8).forEach(function (n) {
      mh += '<div class="miss"><b>' + esc(n.dish.name) + '</b> - blocked by ' + SafePlate.RESTRICTIONS[n.blockedBy].label + '</div>';
    });
    document.getElementById('misses').innerHTML = mh || '<div class="miss">None.</div>';

    document.getElementById('result-card').style.display = 'block';
    lastText = 'SafePlate menu (' + safe.length + ' dishes everyone can eat)\n' + textLines.join('\n');
  }

  document.getElementById('find').addEventListener('click', find);
  document.getElementById('copy').addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastText).then(function () { toast('Copied - send it to the group'); });
    } else toast('Clipboard not available');
  });

  // test hook
  window.__sp = {
    setGuests: function (g) { guests = g; save(); renderGuests(); },
    find: find,
    summary: function () { return document.getElementById('summary').textContent; }
  };

  load();
  renderGuests();
})();
</script>
</body>
</html>
